# Required check: захищені файли (правила, golden-тести, workflows, CLAUDE.md) змінюються лише з дозволу власника.
# pull_request_target: workflow і скрипт беруться з main, код PR не виконується.
name: Guard
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/agent
      - run: node .github/agent/guard.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
