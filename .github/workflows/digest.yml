name: Digest
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/agent
      - run: node .github/agent/digest.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_PAUSED: ${{ vars.AGENT_PAUSED }}
